name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: pip install -r requirements-dev.txt
      - name: Lint
        run: ruff check .
      - name: Run tests
        run: pytest -q
      - name: Run benchmark
        run: python -m app.eval

  adversarial:
    # Extraction and citation can both regress silently: rows disappear while
    # confidence stays at 1.0, and questions about rows that do not exist get
    # answered with a citation. Neither shows up in the accuracy number alone.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Score against documents built to break it
        run: |
          python -m app.docbench_run
          python - <<'EOF'
          from app.docbench_run import score_extraction, score_queries
          from app.extractor_v2 import RobustTableExtractor
          from app.query_v2 import answer_query

          extraction = score_extraction(RobustTableExtractor())
          queries = score_queries(RobustTableExtractor(), answer_query)

          assert extraction["recall"] == 1.0, extraction["documents"]
          assert queries["fabricated_citations"] == 0, queries["fabricated"]
          assert queries["accuracy"] == 1.0, queries["missed"]
          print("extraction recall and citation honesty hold")
          EOF

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build Docker image
        run: docker build -t tablextract:ci .
      - name: Smoke-test the container
        run: |
          docker run -d --name tablextract -p 8000:8000 tablextract:ci
          for i in $(seq 1 10); do
            curl -sf http://localhost:8000/healthz && break
            sleep 1
          done
          curl -sf http://localhost:8000/healthz
          curl -sf -X POST http://localhost:8000/v1/extract \
            -H "Content-Type: application/json" \
            -d '{"text": "A  B\nrow1  row2\nrow3  row4", "source": "ci-test"}'
          docker logs tablextract
          docker stop tablextract
